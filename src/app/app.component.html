<!-- Layout para login/registro -->
<ng-container *ngIf="!mostrarLayout; else mainLayout">
  <main class="content">
    <router-outlet></router-outlet>
  </main>
</ng-container>

<!-- Layout principal con header y navbar -->
<ng-template #mainLayout>
  <!-- Header dinámico -->
  <app-header [tituloModulo]="tituloModulo"></app-header>

  <!-- Contenido principal -->
  <main class="content">
    <router-outlet></router-outlet>
  </main>

  <!-- Barra de navegación inferior -->
  <nav class="bottom-nav" id="bottomNav">
    <a data-route="dashboard/home"
       (click)="navegar('dashboard/home')" 
       [class.active]="currentRoute.startsWith('/dashboard')">
      <span class="material-symbols-outlined">business_center</span>
      <span class="label">Dashboard</span>
    </a>

    <a data-route="asistencia/entrada"
       (click)="navegar('asistencia/entrada')" 
       [class.active]="currentRoute.startsWith('/asistencia')">
      <span class="material-symbols-outlined">badge</span>
      <span class="label">Asistencia</span>
    </a>

    <a data-route="reportes/historial"
       (click)="navegar('reportes/historial')" 
       [class.active]="currentRoute.startsWith('/reportes')">
      <span class="material-symbols-outlined">analytics</span>
      <span class="label">Reportes</span>
    </a>

    <a data-route="cuenta/perfil"
       (click)="navegar('cuenta/perfil')" 
       [class.active]="currentRoute.startsWith('/cuenta')">
      <span class="material-symbols-outlined">manage_accounts</span>
      <span class="label">Cuenta</span>
    </a>
  </nav>
</ng-template>
