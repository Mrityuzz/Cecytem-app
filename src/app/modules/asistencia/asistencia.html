<div class="asistencia-page">
  <header class="header">
    <h1>Asistencia</h1>
  </header>

  <main class="asistencia-container">
    <h2>Asistencia En Tiempo Real</h2>

    <div class="lista-asistencia" *ngIf="asistencia.length > 0">
      <div *ngFor="let registro of asistencia" class="registro entrada">
        <span class="tipo">Entrada</span>
        <span class="hora">{{ registro.entrada }}</span>
      </div>

      <div *ngFor="let registro of asistencia" class="registro salida">
        <span class="tipo">Salida</span>
        <span class="hora">{{ registro.salida }}</span>
      </div>
    </div>
  </main>
</div>
