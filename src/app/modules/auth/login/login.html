<app-auth-header titulo="Login"></app-auth-header>

<div class="auth-container">
  <img src="/assets/logo/CECYTEM.png" alt="Logo CECyTEM" class="logo" />

  <h2>¡Bienvenido!</h2>

  <form>
    <div class="input-group">
      <i class="fas fa-envelope"></i>
      <input
        id="email"
        type="email"
        placeholder="Ingresa tu correo"
        [(ngModel)]="email"
        name="email"
      />
    </div>

    <div class="input-group">
      <i class="fas fa-lock"></i>
      <input
        id="password"
        type="password"
        placeholder="Ingresa tu contraseña"
        [(ngModel)]="password"
        name="password"
      />
    </div>

    <button type="button" (click)="onLogin()">
      <i class="fas fa-sign-in-alt"></i> Iniciar sesión
    </button>
  </form>
</div>
