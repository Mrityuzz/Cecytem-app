<div class="credencial-container" *ngIf="credencial$ | async as credencial">
  <div class="credencial-card">
    <!-- Franja lateral -->
    <div class="lateral">
      <p>CECYTE PLANTEL 12 MORELIA</p>
    </div>

    <!-- Contenido principal -->
    <div class="contenido">
      <div class="header">
        <img src="/assets/logo/CECYTEM.png" alt="Logo CECyTE" />
        <h3>CECyTE</h3>
        <p>Colegios de Estudios Científicos y Tecnológicos</p>
      </div>

      <div class="foto">
        <span class="material-symbols-outlined">account_circle</span>
      </div>

      <div class="info">
        <p class="nombre">{{ credencial.nombre }}</p>
        <p class="carrera">{{ credencial.carrera_tecnica }}</p>
        <p class="control">{{ credencial.numero_control }}</p>
      </div>

      <!-- Años de vigencia dinámicos -->
      <div class="años">
        <span *ngFor="let anio of credencial.anios"
              [ngClass]="{
                activo: currentYear === anio && credencial.activo,
                inactivo: currentYear === anio && !credencial.activo
              }">
          {{ anio }}
        </span>
      </div>
    </div>
  </div>
</div>
